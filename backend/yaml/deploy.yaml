apiVersion: apps/v1
kind: Deployment
metadata:
  name: bucams-api-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bucams-api
  template:
    metadata:
      labels:
        app: bucams-api
    spec:
      containers:
      - name: bucams-api
        image: bucams:3.1
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
        ports:
        - containerPort: 8080
        # 컨테이너 안의 애플리케이션이 시작되었는지 확인한다.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          # 실패를 허용하는 최대 횟수
          failureThreshold: 10
          # 10초마다 상태를 확인
          periodSeconds: 10
        # 컨테이너 안의 애플리케이션이 살아있는지 지속적으로 확인한다.
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        # 컨테이너 안의 애플리케이션이 실제로 서비스 요청에 응답할 수 있는지 확인한다.
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5